name: salesmind

services:
  db:
    # Override with a mirror prefix on networks that cannot reach Docker Hub.
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:0.8.6-pg16-bookworm}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-salesmind}
      POSTGRES_USER: ${POSTGRES_USER:-salesmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    env_file:
      # Local developer settings first, then the deployment overrides. Both are
      # optional so a fresh server can run from .env.production.local alone.
      - path: .env
        required: false
      - path: .env.production.local
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-salesmind}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-salesmind}
      # LangGraph keeps its tables in the same database by default; point this
      # at a separate database when checkpoints should not share one.
      LANGGRAPH_CHECKPOINT_DATABASE_URL: ${LANGGRAPH_CHECKPOINT_DATABASE_URL:-postgres://${POSTGRES_USER:-salesmind}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-salesmind}}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    env_file:
      - path: .env
        required: false
      - path: .env.production.local
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-salesmind}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-salesmind}
      LANGGRAPH_CHECKPOINT_DATABASE_URL: ${LANGGRAPH_CHECKPOINT_DATABASE_URL:-postgres://${POSTGRES_USER:-salesmind}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-salesmind}}
    depends_on:
      db:
        condition: service_healthy
      # The web entrypoint applies migrations; wait for it before claiming jobs.
      web:
        condition: service_healthy
    volumes:
      - media:/app/media
    # Overrides the image entrypoint: this process never serves HTTP.
    entrypoint: ["python", "manage.py", "run_generation_worker", "--poll-seconds", "3"]
    restart: unless-stopped

  nginx:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - staticfiles:/app/staticfiles:ro
    restart: unless-stopped

volumes:
  pgdata:
  media:
  staticfiles:
