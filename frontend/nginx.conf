server {
    listen 80;
    server_name _;

    # Matches KNOWLEDGE_MAX_FILE_SIZE_BYTES (20 MB) plus multipart overhead.
    client_max_body_size 22m;

    location /healthz {
        proxy_pass http://web:8000/healthz;
        # Without this nginx sends Host: web:8000, which ALLOWED_HOSTS rejects.
        proxy_set_header Host $host;
        access_log off;
    }

    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Generation is synchronous today; keep the proxy from cutting it off.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        access_log off;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
