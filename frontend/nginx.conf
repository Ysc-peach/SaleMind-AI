server {
    listen 80;
    server_name _;

    # Matches KNOWLEDGE_MAX_FILE_SIZE_BYTES (20 MB) plus multipart overhead.
    client_max_body_size 22m;

    # Docker's embedded DNS. A literal upstream in proxy_pass is resolved only
    # once when nginx starts; after `compose up -d web` replaces the container,
    # nginx would keep dialing its old IP and every request would return 502.
    # Variables plus a resolver make the lookup happen per request.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /healthz {
        set $web_upstream "web:8000";
        proxy_pass http://$web_upstream/healthz;
        # Without this nginx sends Host: web:8000, which ALLOWED_HOSTS rejects.
        proxy_set_header Host $host;
        access_log off;
    }

    location /api/ {
        set $web_upstream "web:8000";
        proxy_pass http://$web_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Generation is synchronous today; keep the proxy from cutting it off.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /admin/ {
        set $web_upstream "web:8000";
        proxy_pass http://$web_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
        access_log off;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
